<!DOCTYPE html>
<html>
<head>
    <title>Test Events Frontend</title>
</head>
<body>
    <h1>Events Frontend Test</h1>
    <div id="results"></div>
    
    <script type="module">
        // Fetch events from the API
        async function testEvents() {
            try {
                const response = await fetch('http://localhost:5558/api/events');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const events = await response.json();
                
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<h2>Events from API:</h2>';
                
                events.forEach((event, index) => {
                    const eventDiv = document.createElement('div');
                    eventDiv.style.marginBottom = '20px';
                    eventDiv.style.padding = '10px';
                    eventDiv.style.border = '1px solid #ccc';
                    
                    eventDiv.innerHTML = `
                        <h3>${index + 1}. ${event.title}</h3>
                        <p><strong>ID:</strong> ${event.id}</p>
                        <p><strong>Slug:</strong> ${event.slug || '❌ NO SLUG'}</p>
                        <p><strong>Has slug property:</strong> ${'slug' in event ? 'Yes' : 'No'}</p>
                        <p><strong>Date:</strong> ${event.date}</p>
                        <p><strong>Location:</strong> ${event.location}</p>
                    `;
                    
                    resultsDiv.appendChild(eventDiv);
                });
                
                // Summary
                const withSlugs = events.filter(e => e.slug);
                const summaryDiv = document.createElement('div');
                summaryDiv.style.marginTop = '20px';
                summaryDiv.style.fontWeight = 'bold';
                summaryDiv.innerHTML = `<p>Summary: ${withSlugs.length}/${events.length} events have slugs</p>`;
                resultsDiv.appendChild(summaryDiv);
                
            } catch (error) {
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testEvents();
    </script>
</body>
</html>
