server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers - Defense in Depth
    # Prevents clickjacking by restricting frame embedding to same-origin only
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevents MIME type sniffing, ensures Content-Type is respected
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS protection for older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Controls referrer information in requests to third-party sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restricts browser feature access (camera, microphone, geolocation)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Enforces HTTPS for 1 year and includes subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy: Defense against XSS, injection attacks
    # - default-src 'self': Restricts all content to same-origin by default
    # - script-src: Allows scripts from self and required unsafe directives for framework
    # - style-src: Allows styles from self and inline (required for dynamic theming)
    # - img-src: Allows images from self, data URIs, and HTTPS resources
    # - font-src: Allows fonts from self and data URIs
    # - connect-src: Allows XHR/fetch to Supabase, OpenAI, Anthropic APIs, and self
    # - frame-ancestors: Prevents embedding in iframes (defense-in-depth with X-Frame-Options)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.openai.com https://api.anthropic.com; frame-ancestors 'self';" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}