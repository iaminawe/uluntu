type Topic {
  id: ID!
  name: String!
  slug: String!
  description: String
  icon: String
  color: String
  sort_order: Int!
  content_count: Int
  created_at: String!
  updated_at: String!
}

type TopicAnalytics {
  topic_id: ID!
  topic_name: String!
  slug: String!
  content_count: Int!
  news_count: Int!
  event_count: Int!
  resource_count: Int!
  group_count: Int!
  marketplace_count: Int!
  opportunity_count: Int!
  company_count: Int!
}

input TopicInput {
  name: String!
  description: String
  icon: String
  color: String
  sort_order: Int
}

input TopicUpdateInput {
  name: String
  description: String
  icon: String
  color: String
  sort_order: Int
}

type Query {
  topics: [Topic!]!
  topic(id: ID!): Topic
  topicBySlug(slug: String!): Topic
  topicAnalytics: [TopicAnalytics!]!
}

type Mutation {
  createTopic(input: TopicInput!): Topic!
  updateTopic(id: ID!, input: TopicUpdateInput!): Topic!
  deleteTopic(id: ID!): Boolean!
  
  # Entity topic associations
  addTopicsToNews(newsId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromNews(newsId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToEvent(eventId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromEvent(eventId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToResource(resourceId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromResource(resourceId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToGroup(groupId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromGroup(groupId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToMarketplace(listingId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromMarketplace(listingId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToOpportunity(opportunityId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromOpportunity(opportunityId: ID!, topicIds: [ID!]!): Boolean!
  
  addTopicsToCompany(companyId: ID!, topicIds: [ID!]!): Boolean!
  removeTopicsFromCompany(companyId: ID!, topicIds: [ID!]!): Boolean!
}