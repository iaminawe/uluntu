name: Claude PR review

# Automatically reviews pull requests opened from branches in this repository.
#
# Pull requests from forks are skipped on purpose: GitHub doesn't give fork PRs
# access to secrets on the `pull_request` event. Switching to `pull_request_target`
# would run with secrets against untrusted code. For a fork PR, a maintainer can
# comment "@claude review this PR" instead (see claude.yml).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Set up by running /install-github-app in Claude Code. To use an API
          # key instead, replace this with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Uluntu, an open-source community platform
            (React + Vite + TypeScript, Supabase, Vercel functions in api/). Read
            CLAUDE.md and CONTRIBUTING.md first for project conventions.

            Report real problems, not style preferences. In priority order:
            1. Security: secrets or keys in VITE_* variables or client code; any
               non-static read of import.meta.env; new tables or functions without
               row-level security; SECURITY DEFINER functions without
               `set search_path`; missing auth checks in api/ routes; unsanitised
               HTML rendered with dangerouslySetInnerHTML.
            2. Correctness bugs and unhandled edge cases.
            3. Architecture: data access that bypasses the feature's api/ layer,
               server state kept in Redux instead of React Query, files growing
               past ~500 lines.
            4. Missing tests for new behaviour.

            Use inline comments for specific lines and one short top-level summary.
            If the PR looks good, say so briefly. Don't pad the review.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
