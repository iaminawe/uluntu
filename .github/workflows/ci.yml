name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-publishable-key

      - name: Make sure no server secret reached the client bundle
        run: |
          # Sourcemaps are skipped: they contain library doc comments that mention "service_role".
          if grep -rlE --exclude='*.map' 'service_role|sb_secret_|sk-ant-|re_[A-Za-z0-9]{8}_' dist/; then
            echo "::error::A server-side secret appears in dist/. Check for dynamic import.meta.env access or a secret with a VITE_ prefix."
            exit 1
          fi

  # Typecheck, lint and tests don't pass on main yet (thousands of existing type
  # and lint errors, many of them in dead code). This job reports them without
  # blocking merges. Once each one is green on main, remove its
  # continue-on-error and add the job as a required status check.
  quality:
    name: Typecheck, lint, test (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit and integration tests
        run: npm run test -- --ci
        continue-on-error: true
