          - Database schema: features/gallery/PHOTO_GALLERY_DATABASE_SCHEMA.md
          - Admin guide: features/gallery/admin-guide.md
          - Admin API reference: features/gallery/admin-api-reference.md
      - Menus and navigation:
          - Overview: features/menu/README.md
