[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Prevents clickjacking - DENY restricts frame embedding completely
    X-Frame-Options = "SAMEORIGIN"

    # Prevents MIME type sniffing, ensures Content-Type is respected
    X-Content-Type-Options = "nosniff"

    # Legacy XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"

    # Controls referrer information in requests to third-party sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restricts browser feature access (camera, microphone, geolocation)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Enforces HTTPS for 1 year and includes subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Content-Security-Policy: Defense against XSS, injection attacks
    # Allows scripts/styles from self with unsafe directives (required for framework)
    # Restricts external requests to Supabase, OpenAI, and Anthropic APIs
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.openai.com https://api.anthropic.com; frame-ancestors 'self';"