<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Nelson Tech Deployment Verification</h1>
    
    <div id="results"></div>
    
    <script type="module">
        const results = document.getElementById('results');
        
        function addResult(title, content, status = 'info') {
            const div = document.createElement('div');
            div.className = `status ${status}`;
            div.innerHTML = `<strong>${title}:</strong> ${content}`;
            results.appendChild(div);
        }
        
        function addPre(content) {
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(content, null, 2);
            results.appendChild(pre);
        }
        
        // Test 1: Check if this page loads
        addResult('Page Load', 'Verification page loaded successfully', 'success');
        
        // Test 2: Check environment
        try {
            if (typeof import !== 'undefined' && import.meta && import.meta.env) {
                const env = import.meta.env;
                addResult('Environment Variables', 'import.meta.env is available', 'success');
                
                // Check specific variables
                const requiredVars = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY'];
                const foundVars = {};
                let missingVars = [];
                
                requiredVars.forEach(varName => {
                    if (env[varName]) {
                        foundVars[varName] = env[varName].substring(0, 20) + '...';
                    } else {
                        missingVars.push(varName);
                    }
                });
                
                if (missingVars.length === 0) {
                    addResult('Required Variables', 'All required environment variables found', 'success');
                    addPre(foundVars);
                } else {
                    addResult('Required Variables', `Missing: ${missingVars.join(', ')}`, 'error');
                    addResult('Build Issue', 'Environment variables were not set during Docker build', 'error');
                }
                
                // Show all env vars (sanitized)
                const allEnv = {};
                Object.keys(env).forEach(key => {
                    if (key.startsWith('VITE_')) {
                        allEnv[key] = typeof env[key] === 'string' && env[key].length > 20 
                            ? env[key].substring(0, 20) + '...' 
                            : env[key];
                    }
                });
                
                addResult('All Vite Variables', 'Found variables:', 'info');
                addPre(allEnv);
                
            } else {
                addResult('Environment Variables', 'import.meta.env not available', 'error');
                addResult('Possible Issue', 'This might be a build configuration problem', 'warning');
            }
        } catch (error) {
            addResult('Environment Check', `Error: ${error.message}`, 'error');
        }
        
        // Test 3: Try to load the actual app
        addResult('Next Steps', 'Copy this file to your deployment to verify environment variables', 'warning');
        
        // Add timestamp
        const now = new Date().toISOString();
        addResult('Test Time', now, 'info');
    </script>
</body>
</html>
